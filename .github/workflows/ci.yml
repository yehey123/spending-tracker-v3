name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: spending_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements/base.txt
          pip install -r backend/requirements/dev.txt

      - name: Run migrations and tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/spending_tracker_test
          TEST_DB_HOST: localhost
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          alembic upgrade head
          pytest --tb=short -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create .env for docker compose
        run: |
          echo "DB_USER=${{ secrets.CI_DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.CI_DB_PASSWORD }}" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@db:5432/spending_tracker" >> .env

      - name: Start full stack
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: docker compose up -d --build
        # Backend CMD now runs "alembic upgrade head && uvicorn ..." so migrations
        # are applied automatically before the service becomes healthy.

      - name: Wait for stack to be healthy
        run: |
          # Use 127.0.0.1 — Ubuntu 24 resolves 'localhost' to ::1 (IPv6) but Docker publishes on 0.0.0.0 (IPv4)
          timeout 300 bash -c 'until curl -sf http://127.0.0.1/api/health | grep -q "healthy"; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: frontend
        env:
          BASE_URL: "http://127.0.0.1"
          CI: "true"
        run: npx playwright test

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== backend logs (last 150 lines) ==="
          docker compose logs backend --tail 150
          echo "=== nginx logs ==="
          docker compose logs nginx --tail 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  android-build:
    name: Android Build (Debug)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build web assets for Capacitor
        working-directory: frontend
        env:
          CAPACITOR_BUILD: "1"
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  android-maestro:
    name: Android Maestro E2E
    runs-on: ubuntu-22.04
    needs: android-build

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: apk/

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install emulator system dependencies
        run: sudo apt-get install -y libpulse0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Diagnose KVM and CPU
        run: |
          ls -l /dev/kvm
          grep -cE 'vmx|svm' /proc/cpuinfo

      - name: Run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-options: "-no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect"
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            maestro test .maestro/smoke.yaml
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"

  ios-build:
    name: iOS Build (Simulator)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build web assets for Capacitor
        working-directory: frontend
        env:
          CAPACITOR_BUILD: "1"
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Build for iOS Simulator
        working-directory: frontend
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
