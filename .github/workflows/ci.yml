name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: spending_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d spending_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements/base.txt
          pip install -r backend/requirements/dev.txt

      - name: Run migrations and tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/spending_tracker_test
          TEST_DB_HOST: localhost
        run: |
          alembic upgrade head
          pytest --tb=short -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start full stack
        env:
          APP_SECRET: "test-secret-32chars-minimum-here!!"
        run: docker compose up -d --build
        # Backend CMD now runs "alembic upgrade head && uvicorn ..." so migrations
        # are applied automatically before the service becomes healthy.

      - name: Wait for stack to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost/api/health; do sleep 3; done'

      - name: Run Playwright tests
        working-directory: frontend
        env:
          BASE_URL: "http://localhost"
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v
