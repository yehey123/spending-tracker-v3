# Single source of truth for lint/format hooks. Chained from .githooks/pre-commit.
# Excluded paths (regex, matched against repo-relative paths):
#  - frontend/public/sw.js, workbox-*.js: generated by next-pwa on every build (minified output)
#  - backend/tests/fixtures/ocr_external/: third-party OCR data, must stay byte-identical
exclude: ^(frontend/public/(sw|workbox-[^/]+)\.js|backend/tests/fixtures/ocr_external/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        entry: scripts/eslint-staged.sh
