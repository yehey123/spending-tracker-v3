services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/spending_tracker
    volumes:
      - exchange_rates_data:/data/rates
    depends_on:
      db:
        condition: service_healthy
      rates-init:
        condition: service_completed_successfully

  rates-init:
    image: curlimages/curl:8.11.1
    volumes:
      - exchange_rates_data:/data/rates
    environment:
      RATES_DB_URL: ${RATES_DB_URL:-}
    entrypoint: >
      sh -c "
        if [ -n \"$$RATES_DB_URL\" ] && [ ! -s /data/rates/exchange_rates.db ]; then
          echo 'Bootstrapping exchange rate DB...';
          mkdir -p /data/rates;
          curl -fL --retry 3 \"$$RATES_DB_URL\" -o /data/rates/exchange_rates.db && echo 'Done.' || echo 'Bootstrap download failed, starting empty.';
        else
          mkdir -p /data/rates;
          echo 'Skipping bootstrap (RATES_DB_URL not set or DB already present).';
        fi
      "
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: spending_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d spending_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  exchange_rates_data:
