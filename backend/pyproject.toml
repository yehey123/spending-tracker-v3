[project]
name = "spending-tracker-backend"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/domain/models/*.py" = ["F821"]
# main.py: os.umask/logging setup must run before the app imports below it
"src/main.py" = ["E402"]
# statement_pipeline.py: optional-dependency imports (PIL, tesseract) sit in try/except guards
"src/domain/services/statement_pipeline.py" = ["E402"]
